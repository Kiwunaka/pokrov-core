name: One-time DNS generation review
on:
  push:
    branches: [fix/dns-unpooled-query-lifecycle]
    paths: [.github/workflows/one-time-dns-review.yml]
permissions:
  contents: write
jobs:
  review:
    if: github.repository == 'Kiwunaka/pokrov-core' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
      - name: Exact supported Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://go.dev/dl/go1.26.9.linux-amd64.tar.gz -o "$RUNNER_TEMP/go.tar.gz"
          echo "42d158b4d8f7b61ac0a830567c940a86098fb7aac52e467a5ebec03ef5cc2f8d  $RUNNER_TEMP/go.tar.gz" | sha256sum --check
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/go.tar.gz"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          echo 'GOTOOLCHAIN=local' >> "$GITHUB_ENV"
      - name: Reproduce old-generation admission
        working-directory: engine/sing-box
        shell: bash
        run: |
          set +e
          go test -count=1 -race -ldflags=-checklinkname=0 -tags with_utls,tfogo_checklinkname0 ./dns/transport -run '^TestResetDoesNotAdmitProbeFromOldGeneration$' > "$RUNNER_TEMP/dns-generation.txt" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/dns-generation.txt"
          test "$result" -ne 0
          grep -F 'old generation admitted a probe after Reset' "$RUNNER_TEMP/dns-generation.txt"
      - name: Preserve the dispatch generation before starting a probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('engine/sing-box/dns/transport/multiplexer.go')
          s = p.read_text()
          old = '\t\tm.maybeStartProbe(ctx, message)'
          assert s.count(old) == 1
          s = s.replace(old, '\t\tm.maybeStartProbe(singleCtx, message)')
          old = '\tm.probeAccess.Lock()\n\tif m.reuseState.Load() == reuseStateProbing {'
          new = '\tm.probeAccess.Lock()\n\tif context.Cause(ctx) != nil {\n\t\tm.probeAccess.Unlock()\n\t\treturn\n\t}\n\tif m.reuseState.Load() == reuseStateProbing {'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          gofmt -w engine/sing-box/dns/transport/multiplexer.go engine/sing-box/dns/transport/multiplexer_generation_test.go
      - name: Test the complete changed package
        working-directory: engine/sing-box
        run: go test -count=1 -race -ldflags=-checklinkname=0 -tags with_utls,tfogo_checklinkname0 ./dns/transport
      - name: Commit verified fix to the same branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/sing-box/dns/transport/multiplexer.go engine/sing-box/dns/transport/multiplexer_generation_test.go
          git commit -m 'fix(dns): fence reuse probes against a reset dispatch generation'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
